<div [ngClass]="{'w-64': !collapsed, 'w-16': collapsed}" class="bg-blue-800 text-white transition-all duration-300 h-screen">
  <div class="p-4 flex items-center border-b border-blue-700">
    <img src="assets/images/logo.png" alt="Logo" class="w-10 h-10 mr-2">
    <h1 class="text-xl font-semibold transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Almacén Reactivos</h1>
  </div>
  <nav class="mt-5">
    <a routerLink="/inicio" routerLinkActive="bg-blue-700 border-l-4 border-blue-300" [routerLinkActiveOptions]="{exact: true}" class="block py-3 px-4 hover:bg-blue-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="ml-3 transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Inicio</span>
    </a>
    <a routerLink="/inicio/dashboard" routerLinkActive="bg-blue-700 border-l-4 border-blue-300" class="block py-3 px-4 hover:bg-blue-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
      <span class="ml-3 transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Dashboard</span>
    </a>
    <a routerLink="/inicio/inventario" routerLinkActive="bg-blue-700 border-l-4 border-blue-300" class="block py-3 px-4 hover:bg-blue-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
      </svg>
      <span class="ml-3 transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Inventario</span>
    </a>
    <a routerLink="/inicio/movimientos" routerLinkActive="bg-blue-700 border-l-4 border-blue-300" class="block py-3 px-4 hover:bg-blue-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
      <span class="ml-3 transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Movimientos</span>
    </a>
    <a class="block py-3 px-4 hover:bg-blue-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      <span class="ml-3 transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Solicitudes</span>
    </a>
    <a routerLink="/inicio/historial" routerLinkActive="bg-blue-700 border-l-4 border-blue-300" class="block py-3 px-4 hover:bg-blue-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="ml-3 transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Historial</span>
    </a>
    <a routerLink="/inicio/reportes" routerLinkActive="bg-blue-700 border-l-4 border-blue-300" class="block py-3 px-4 hover:bg-blue-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span class="ml-3 transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Reportes</span>
    </a>
    <a routerLink="/inicio/gestion-informacion" routerLinkActive="bg-blue-700 border-l-4 border-blue-300" class="block py-3 px-4 hover:bg-blue-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
      </svg>
      <span class="ml-3 transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Gestión Información</span>
    </a>
    <a routerLink="/inicio/usuarios" routerLinkActive="bg-blue-700 border-l-4 border-blue-300" class="block py-3 px-4 hover:bg-blue-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <span class="ml-3 transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Usuarios</span>
    </a>
    <a class="block py-3 px-4 hover:bg-blue-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span class="ml-3 transition-opacity duration-300" [ngClass]="{'opacity-0': collapsed, 'opacity-100': !collapsed}">Configuración</span>
    </a>
  </nav>
  <!-- Collapse button at bottom -->
  <div class="absolute bottom-4 left-0 w-full flex justify-center">
    <button (click)="toggleSidebar()" class="p-2 rounded-full bg-blue-700 hover:bg-blue-600 focus:outline-none">
      <svg *ngIf="!collapsed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
      </svg>
      <svg *ngIf="collapsed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
      </svg>
    </button>
  </div>
</div>
